services:
  - type: web
    name: production-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: 10
      - key: DAILY_BUDGET_USD
        value: 10.0
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis-service
          property: connectionString

  - type: redis
    name: redis-service
    plan: free
    ipAllowList: []
